<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tollgate demo</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
    --accent: #1f5f8b; --allow: #1d7a46; --allow-bg: #e6f4ec; --review: #94620a; --review-bg: #fbf1dc;
    --deny: #b3261e; --deny-bg: #fbe9e7; --user: #1f5f8b; --user-ink: #ffffff; --agent: #efede7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
      --accent: #7db4dc; --allow: #6fd19a; --allow-bg: #17301f; --review: #f0c25e; --review-bg: #352a12;
      --deny: #ff8a80; --deny-bg: #3a1a17; --user: #2c6e9c; --user-ink: #ffffff; --agent: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .spacer { flex: 1; }
  select { font: inherit; font-size: 13.5px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; user-select: none; }
  .toggle input { width: 44px; height: 24px; appearance: none; background: var(--deny); border-radius: 999px; position: relative; cursor: pointer; margin: 0; }
  .toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
  .toggle input:checked { background: var(--allow); }
  .toggle input:checked::after { left: 23px; }
  main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  h2 { font-size: 14px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .chat { display: flex; flex-direction: column; height: calc(100vh - 110px); min-height: 480px; }
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 10px; }
  .msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--agent); border-bottom-left-radius: 4px; }
  .msg.note { align-self: center; font-size: 13px; color: var(--muted); background: none; padding: 2px; text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  .chip.attack::before { content: "⚠ "; color: var(--deny); }
  .chip:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; font: inherit; resize: vertical; min-height: 44px; max-height: 160px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button.primary { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 0 18px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .empty { color: var(--muted); font-size: 13px; }
  .item { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; font-size: 13.5px; }
  .item .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .item code, td code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .item .args { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; margin-top: 4px; }
  .verdict { font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; }
  .v-executed, .v-allow { background: var(--allow-bg); color: var(--allow); }
  .v-queued, .v-review { background: var(--review-bg); color: var(--review); }
  .v-blocked, .v-deny, .v-failed { background: var(--deny-bg); color: var(--deny); }
  .reason { margin-top: 3px; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .actions .approve { border-color: var(--allow); color: var(--allow); }
  .actions .reject { border-color: var(--deny); color: var(--deny); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .warn { background: var(--deny-bg); color: var(--deny); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Tollgate</h1>
    <div class="sub">Kech Crafts support agent · signed in as <strong id="who">Amina</strong></div>
  </div>
  <span class="badge" id="backend">connecting…</span>
  <span class="spacer"></span>
  <select id="agent" aria-label="Agent" title="Switching starts a new conversation">
    <option value="ai">Agent: Gemma (real AI)</option>
    <option value="hijacked">Agent: fully hijacked (worst case)</option>
  </select>
  <label class="toggle" title="Switching starts a new conversation">
    <input type="checkbox" id="guarded" checked>
    <span id="guardLabel">Tollgate on</span>
  </label>
</header>

<main>
  <section class="chat">
    <h2>Chat</h2>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="form">
      <textarea id="input" placeholder="Write as the customer, or pick a message above" required></textarea>
      <button class="primary" id="send">Send</button>
    </form>
  </section>

  <div class="side">
    <section>
      <h2>Waiting for a person</h2>
      <div id="pending"></div>
    </section>
    <section>
      <h2>Tollgate decisions</h2>
      <div id="events"></div>
    </section>
    <section>
      <h2 id="callsTitle">Calls that reached Braintree</h2>
      <div id="calls"></div>
    </section>
    <section>
      <h2><span id="who2">Amina</span>'s payments</h2>
      <div id="orders"></div>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
const money = (cents) => '$' + (cents / 100).toFixed(2);
let convo = null;

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function say(kind, text) {
  const log = $('log');
  log.append(el('div', `msg ${kind}`, text));
  log.scrollTop = log.scrollHeight;
}

function args(obj) {
  return JSON.stringify(obj);
}

function renderChips(scenarios) {
  const chips = $('chips');
  chips.replaceChildren();
  for (const s of scenarios) {
    const chip = el('button', `chip${s.attack ? ' attack' : ''}`, s.title.replace(/^Control: /, ''));
    chip.type = 'button';
    chip.title = s.message;
    chip.onclick = () => { $('input').value = s.message; $('input').focus(); };
    chips.append(chip);
  }
}

function render(view) {
  convo = view;
  $('backend').textContent = view.backend;
  $('who').textContent = $('who2').textContent = view.customer.name;

  const pending = $('pending');
  pending.replaceChildren();
  if (!view.guarded) pending.append(el('div', 'warn', 'Tollgate is off: the agent calls Braintree directly, and nothing waits for a person.'));
  else if (!view.pending.length) pending.append(el('div', 'empty', 'Nothing waiting.'));
  for (const p of view.pending) {
    const card = el('div', 'item');
    const top = el('div', 'top');
    top.append(el('span', 'verdict v-review', 'review'), el('code', '', p.tool));
    card.append(top, el('div', 'reason', p.decision.reason), el('div', 'args', args(p.args)));
    const actions = el('div', 'actions');
    const approve = el('button', 'approve', 'Approve');
    const reject = el('button', 'reject', 'Reject');
    approve.onclick = () => decide(p.id, 'approve');
    reject.onclick = () => decide(p.id, 'reject');
    actions.append(approve, reject);
    card.append(actions);
    pending.append(card);
  }

  const events = $('events');
  events.replaceChildren();
  if (!view.guarded) events.append(el('div', 'empty', 'Tollgate is off, so no calls are checked.'));
  else if (!view.events.length) events.append(el('div', 'empty', 'No payment calls yet.'));
  for (const e of [...view.events].reverse()) {
    const card = el('div', 'item');
    const top = el('div', 'top');
    top.append(el('span', `verdict v-${e.outcome}`, e.outcome), el('code', '', e.tool), el('span', 'empty', e.decision.rule));
    card.append(top, el('div', 'reason', e.decision.reason), el('div', 'args', args(e.args)));
    if (e.error) card.append(el('div', 'args', 'Braintree: ' + e.error));
    events.append(card);
  }

  const calls = $('calls');
  calls.replaceChildren();
  if (!view.backendCalls.length) calls.append(el('div', 'empty', 'None yet.'));
  for (const c of [...view.backendCalls].reverse()) {
    const card = el('div', 'item');
    const top = el('div', 'top');
    top.append(el('span', `verdict v-${c.ok ? 'executed' : 'failed'}`, c.ok ? 'done' : 'failed'), el('code', '', c.tool));
    card.append(top, el('div', 'args', args(c.args)));
    card.append(el('div', 'args', c.ok ? '→ ' + args(c.result) : 'Braintree: ' + c.error));
    calls.append(card);
  }

  const orders = $('orders');
  orders.replaceChildren();
  const table = el('table');
  const head = el('tr');
  head.append(el('th', '', 'Transaction'), el('th', '', 'Date'), el('th', 'num', 'Paid'), el('th', 'num', 'Refunded'));
  table.append(head);
  for (const o of view.customer.orders) {
    const row = el('tr');
    const id = el('td'); id.append(el('code', '', o.orderId));
    row.append(id, el('td', '', o.capturedAt.slice(0, 10)), el('td', 'num', money(o.totalCents)), el('td', 'num', money(o.refundedCents)));
    table.append(row);
  }
  orders.append(table);
}

async function start() {
  const guarded = $('guarded').checked;
  const agent = $('agent').value;
  $('guardLabel').textContent = guarded ? 'Tollgate on' : 'Tollgate off';
  $('log').replaceChildren();
  say('note', guarded ? 'New conversation with Tollgate guarding every payment call.' : 'New conversation with Tollgate OFF: the agent holds the same Braintree tools, unchecked.');
  if (agent === 'hijacked') say('note', 'Hijacked agent: no AI model. Each attack button makes exactly the call the attacker wants, as a fully compromised agent would.');
  if ($('backend').textContent.includes('live')) say('note', 'Creating fresh payments in the Braintree sandbox for this conversation…');
  $('send').disabled = true;
  try {
    const view = await api('/api/conversations', { guarded, agent });
    render(view);
    renderChips(view.scenarios);
    return view;
  } finally {
    $('send').disabled = false;
  }
}

async function decide(approvalId, action) {
  try {
    const { view } = await api(`/api/conversations/${convo.id}/approvals/${approvalId}/${action}`, {});
    const last = view.events[view.events.length - 1];
    say('note', `Staff ${action === 'approve' ? 'approved' : 'rejected'} ${last.tool}: ${last.outcome}${last.error ? ' (' + last.error + ')' : ''}`);
    render(view);
  } catch (err) { say('note', err.message); }
}

$('form').onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $('input').value.trim();
  if (!text || !convo) return;
  $('input').value = '';
  $('send').disabled = true;
  say('user', text);
  try {
    const { reply, view } = await api(`/api/conversations/${convo.id}/messages`, { message: text });
    say('agent', reply || '(no reply)');
    render(view);
  } catch (err) {
    say('note', err.message);
  } finally {
    $('send').disabled = false;
    $('input').focus();
  }
};

$('input').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('form').requestSubmit(); }
});
$('guarded').onchange = $('agent').onchange = () => start().catch((err) => say('note', err.message));

(async () => {
  try {
    const info = await api('/api/info');
    $('backend').textContent = info.backend;
    const params = new URLSearchParams(location.search);
    if (params.get('tollgate') === 'off') $('guarded').checked = false;
    if (params.get('agent') === 'hijacked') $('agent').value = 'hijacked';
    const view = await start();
    const demo = view.scenarios.find((s) => s.id === params.get('demo'));
    if (demo) $('input').value = demo.message;
  } catch (err) { say('note', err.message); }
})();
</script>
</body>
</html>
